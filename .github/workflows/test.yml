# GitHub に push したとき・プルリクエストを作ったときに、自動でコードチェックとテストを実行する
name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: ライブラリのインストール
        run: pip install -r requirements-dev.txt
      - name: コードチェック(ruff)
        run: ruff check .
      - name: テスト(pytest)
        run: pytest -q

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: ライブラリのインストール
        run: npm ci
      - name: テスト(vitest)
        run: npm test
      - name: ビルド(型チェックを含む)
        run: npm run build
